    align-items: center;
    gap: 8px;

  nav.links a{

  }
  nav.links a:hover{ color: var(--text); text-decoration:none; }

    nav.links{ display:none; }
  }

    z-index: 5;
  }

  .trace-node{

    border: 2px solid var(--line);
    transform: translate(-50%,-50%);

    width: 7px; height: 7px; border-radius: 50%;
    background: var(--copper);
    box-shadow: 0 0 8px var(--copper), 0 0 16px var(--copper);

    z-index: 6;
    pointer-events: none;
    transition: top .08s linear;

  @media (max-width: 900px){ #trace-pulse{ display:none; } }

  .section-icon{ flex:none; width:34px; height:34px; color: var(--copper); }
  .section-title{ font-size: 30px; }

  .btn:hover{ text-decoration:none; border-color: var(--copper); transform: translateY(-1px); }
  .btn.primary{ background: var(--copper); border-color: var(--copper); color: #10141a; font-weight:600; }
  .btn.primary:hover{ background: var(--copper-dim); border-color: var(--copper-dim); }
  .btn svg{ width:14px; height:14px; }

    box-shadow: 0 16px 36px rgba(0,0,0,0.6);

  .frame-corner.br{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .contact-strip svg{ width:14px; height:14px; opacity:.8; }

function gallery(images, isDiagram = false, variantClass = ''){
  if(!images || images.length === 0){
    return '';
  }
  let wrapperClass = variantClass;
  if (isDiagram) wrapperClass = 'compact-diagram';

  return `
    <div class="gallery">
      ${images.map(src => `
        <div class="gallery-img-wrapper ${wrapperClass}">
          <img src="${src}" alt="" loading="lazy">
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------- NAVIGATION & TRACE PULSE ---------- */
function renderNav(){
  const sections = [
    { id: "about", label: "About" },
    { id: "projects", label: "Projects" },
    { id: "tech-skills", label: "Tech Skills" },
    { id: "volunteering", label: "Volunteering" },
    { id: "extracurricular", label: "Extracurricular" },
    { id: "skills", label: "Soft Skills" },
    { id: "languages", label: "Languages" },
    { id: "contact", label: "Contact" }
  ];

  const navContainer = document.getElementById('nav-links');
  navContainer.innerHTML = sections.map(s => `<a href="#${s.id}">${s.label}</a>`).join('');

  sections.forEach(s => {
    const node = document.createElement('div');
    node.className = 'trace-node';
    node.id = `trace-${s.id}`;
    document.body.appendChild(node);
  });
}

function updateTrace(){
  const sections = ["about", "projects", "tech-skills", "volunteering", "extracurricular", "skills", "languages", "contact"];
  const pulse = document.getElementById('trace-pulse');

  sections.forEach(id => {
    const sec = document.getElementById(id);
    const node = document.getElementById(`trace-${id}`);
    if (sec && node) {
      const rect = sec.getBoundingClientRect();
      const absTop = window.scrollY + rect.top + 30;
      node.style.top = `${absTop}px`;

      if (window.scrollY + window.innerHeight / 3 >= rect.top && window.scrollY + window.innerHeight / 3 < rect.bottom) {
        node.classList.add('active');
        if (pulse) pulse.style.top = `${absTop}px`;
      } else {
        node.classList.remove('active');
      }
    }
  });
}

/* ---------- INITIALIZE ---------- */
document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  renderAbout();
  renderProjects();
  renderTechnicalSkills();
  renderVolunteering();
  renderExtracurricular();
  renderSkills();
  renderLanguages();
  renderContact();

  document.getElementById('footer').innerHTML = `© ${new Date().getFullYear()} ${DATA.fullName}. All rights reserved.`;

  window.addEventListener('scroll', updateTrace);
  window.addEventListener('resize', updateTrace);
  setTimeout(updateTrace, 100);
});
